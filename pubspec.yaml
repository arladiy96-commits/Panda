name: panda_flutter
description: Panda visual prototype for Android built with Flutter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/panda_splash.mp4
    - assets/images/second_splash.png
    - assets/images/promo_1.jpg
    - assets/images/promo_2.jpg
    - assets/images/promo_3.jpg
    - assets/images/pasta_salmon.jpg
    - assets/images/pasta_chicken.jpg
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700
