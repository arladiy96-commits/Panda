name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish APK to GitHub Releases'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project exists
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml || {
            echo 'Flutter project missing. Run Bootstrap Flutter first.' >&2
            exit 1
          }
          test -d android || {
            echo 'android/ missing. Run Bootstrap Flutter first.' >&2
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Panda.apk
          ls -lh dist/Panda.apk

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panda-APK-${{ github.run_number }}
          path: dist/Panda.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "build-${BUILD_NUMBER}" dist/Panda.apk \
            --repo "$REPOSITORY" \
            --title "Panda APK #${BUILD_NUMBER}" \
            --notes "Manual Flutter Android build from commit ${COMMIT_SHA}. Test build; not signed with a production signing key." \
            --target "$COMMIT_SHA" \
            --prerelease
